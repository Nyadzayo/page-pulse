<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <header class="popup-head">
      <div class="popup-brand">
        <div class="popup-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round"><path d="M2 12h4l3-9 4 18 3-9h4"/></svg>
        </div>
        <span class="popup-title">PagePulse</span>
      </div>
      <div style="display:flex;align-items:center;gap:6px;">
        <button id="btn-theme" class="theme-toggle" title="Toggle theme" aria-label="Toggle light or dark theme"></button>
        <span class="popup-version">v1.0</span>
      </div>
    </header>

    <div id="monitor-list" class="popup-body"></div>

    <div class="popup-render-mode" id="render-mode-row">
      <span class="popup-render-mode-label">Render</span>
      <div class="popup-render-mode-opts" id="render-mode-opts">
        <button class="popup-render-mode-btn active" data-mode="auto" title="Detect automatically (recommended)">Auto</button>
        <button class="popup-render-mode-btn" data-mode="fetch" title="Plain HTML fetch (fast, static pages)">Fetch</button>
        <button class="popup-render-mode-btn" data-mode="browser" title="Hidden iframe (SPAs, JS-rendered)">Browser</button>
      </div>
    </div>

    <div class="popup-actions">
      <button id="btn-add" class="popup-btn primary">+ Add Monitor</button>
      <button id="btn-dashboard" class="popup-btn secondary">Dashboard</button>
    </div>
    <div id="popup-status" class="popup-status" style="display:none;"></div>

    <footer class="popup-footer">
      <span class="privacy-badge">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        Local only
      </span>
      <span id="usage-text" class="popup-usage"><strong>0</strong>/5 monitors</span>
      <div class="popup-usage-bar">
        <div id="usage-fill" class="popup-usage-fill" style="width: 0%"></div>
      </div>
    </footer>
  </div>

  <script src="popup.js" type="module"></script>
</body>
</html>
